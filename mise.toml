[settings]
experimental = true
lockfile = true
github.github_attestations = false
github.slsa = false

[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
goreleaser = "2.18.0"
ko = "0.19.1"
lefthook = "2.1.12"
node = "22.23.2"

[tasks.setup]
description = "Install repository dependencies and Git hooks"
run = [
  "go mod download",
  "lefthook install",
]

[tasks.check]
description = "Run all local validation checks"
run = "make check"

[tasks.lint-fix]
description = "Run the linter and apply supported fixes"
run = "golangci-lint run --fix ./..."

[tasks.build]
description = "Build the server binary"
run = "make build"

[tasks.run]
description = "Run the server over stdio"
run = "make run"
