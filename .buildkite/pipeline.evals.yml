image: "buildkite/hosted-agent-base-images:ubuntu-jammy"

env:
  GITHUB_CLI_VERSION: "2.83.0"
  BUILDKITE_MCP_SERVER_VERSION: "0.7.3"
  MODEL_PROVIDER: "anthropic"
  # CROSS-REPO DEPENDENCY: the eval's red->green CI signal lives outside this
  # repo. babystand.sh clones EVAL_REPO_SLUG (default: the nethsix fork), pushes
  # mcp-eval-scenario-* branches there, and the agent watches their builds on
  # this org/pipeline, which must keep building branch pushes. Scenario branches
  # never exist in THIS repo, so this pipeline's eval step can't recurse.
  # Buildkite API tokens are single-org, so two are needed: the EXTERNAL_ORG
  # token (EVAL_ORG_SLUG, used by the agent's MCP server) and the BUILDKITE_ORG
  # token (this org, used by bk-eval-compare.sh).
  EVAL_ORG_SLUG: "anothertest"
  EVAL_PIPELINE_SLUG: "buildkite-mcp-server"
  # Datadog site for dd-metrics.sh. The API key is scoped to the dd-publish
  # step only — never the eval step (see the SECURITY note there).
  DD_SITE: "datadoghq.com"

# PR CI (lint/test) and the generator step run here. The bork PR builds the eval
# waits on also run on this queue.
agents:
  queue: hosted

cache:
  name: "build-cache"
  paths:
    - "/gocache"
    - "/gomodcache"
  size: "100g"

steps:
  - label: ":buildkite: Running scenarios"
    key: agent
    command: ./scripts/babystand.sh
    # The scenario builds this (blocking) eval agent waits on run in the
    # EVAL_ORG_SLUG org (see above), on a different cluster's agents, so sharing
    # this repo's hosted queue cannot starve them.
    agents:
      queue: hosted
    plugins:
      - docker#v5.14.0:
          image: buildkite-mcp-server-evals:latest
          mount-checkout: false
          mount-buildkite-agent: true
          environment:
            - BUILDKITE
            - BUILDKITE_AGENT_ENDPOINT
            - BUILDKITE_AGENT_ACCESS_TOKEN
            - BUILDKITE_API_TOKEN
            - EVAL_COMPARE_BUILDKITE_API_TOKEN
            # Per-entry tokens: evals.yaml entries may name one of these via
            # token_env when their scenario lives in a different org (see
            # evals/evals.yaml). Add one line here (and a secrets mapping
            # below) per additional org.
            - MCP_EVAL_FRAMEWORK_BUILDKITE_ORG_BUILDKITE_API_TOKEN
            # Cursor auth, for evals.yaml entries with `agent: cursor` (CLI)
            # or `agent: cursor-cloud` (Cloud Agents API — same dashboard
            # key). Both talk to Cursor's backend, so the Buildkite Hosted
            # Models Anthropic proxy (BUILDKITE_AGENT_ENDPOINT above) cannot
            # front them.
            - CURSOR_API_KEY
            - BUILDKITE_BUILD_URL
            # Pin the MCP server source cursor-cloud.sh builds in Cursor's VM
            # to the commit under review (mcp_version: source). Interpolated
            # at pipeline-upload time, when BUILDKITE_COMMIT is this commit.
            - MCP_SRC_SHA=${BUILDKITE_COMMIT}
            # SECURITY: Keys should NOT be mapped here, unless strictly required
            # by the agent, e.g., for eval scenario setup, etc. The
            # evaluated agent runs in this container with unrestricted Bash
            # and inherits its environment, so any credential mapped in is
            # readable (and exfiltratable) by the agent under test.
            # Example: We move Datadog publishing into dd-publish step below instead,
            # from the run-bundle artifacts babystand.sh uploads.
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_ORGANIZATION_SLUG
            - BUILDKITE_PIPELINE_SLUG
            - BUILDKITE_MCP_SERVER_VERSION
            - EVAL_ORG_SLUG
            - EVAL_PIPELINE_SLUG
            - GITHUB_CLI_VERSION
            - GITHUB_TOKEN
            - MODEL_PROVIDER
            # Select the sandboxed claude.sh execution path in babystand.sh.
            - RUN_IN_CI=true
            - LOCAL_CI=false
            - DEBUG_PERMISSIONS=false
            # Required by babystand.sh (no default). Inert in CI — claude.sh
            # always runs bypassPermissions — but declared consciously here;
            # see evals/README.md for the local-mode meaning.
            - LOCAL_BYPASS_PERMISSION=false
            # Per-message parser annotations are on by default; set to "false"
            # (in the top-level env: block) to rely only on the curated summaries.
            - ANNOTATE_MESSAGES
    # Secrets are scoped to this step only: the lint/test jobs execute code
    # from the pushed branch and must not see credentials.
    # NOTE: secret-mapped env var names must not start with BUILDKITE/BK
    # (BUILDKITE_API_TOKEN itself is an allowed exception).
    secrets:
      GITHUB_TOKEN: MCP_EVAL_FRAMEWORK_EXTERNAL_REPO_GITHUB_TOKEN
      BUILDKITE_API_TOKEN: MCP_EVAL_FRAMEWORK_EXTERNAL_ORG_BUILDKITE_API_TOKEN
      EVAL_COMPARE_BUILDKITE_API_TOKEN: MCP_EVAL_FRAMEWORK_BUILDKITE_ORG_BUILDKITE_API_TOKEN
      # Per-entry token_env vars keep the secret's own name (the
      # MCP_EVAL_FRAMEWORK_<ORG>_ORG_BUILDKITE_API_TOKEN convention), so the
      # mapping is 1:1.
      MCP_EVAL_FRAMEWORK_BUILDKITE_ORG_BUILDKITE_API_TOKEN: MCP_EVAL_FRAMEWORK_BUILDKITE_ORG_BUILDKITE_API_TOKEN
      # Cursor CLI API key (generate in the Cursor Dashboard). Maps into
      # the CURSOR_API_KEY env line above.
      CURSOR_API_KEY: MCP_EVAL_FRAMEWORK_CURSOR_API_KEY

  # Publish per-entry run metrics to Datadog, OUTSIDE the agent container.
  # SECURITY: the eval step above runs the evaluated agent with unrestricted
  # Bash, so DD_API_KEY must never exist anywhere in that step — not even
  # captured-then-unset, since /proc/<pid>/environ keeps the exec-time
  # snapshot readable to same-UID processes. babystand.sh records each
  # entry's identity + outcome as a runs/<id>/<run-key>.dd.json artifact in
  # the run bundle; this step downloads those and drives
  # evals/scripts/dd-metrics.sh once per entry. (Local runs publish the same
  # way, manually, after the eval exits: dd-publish.sh <runs-dir>.)
  - label: ":datadog: Publish eval metrics"
    key: dd-publish
    command: ./evals/scripts/dd-publish.sh
    # Publish whatever bundles were uploaded even when the eval step fails —
    # partial results are exactly what a failure investigation needs.
    depends_on:
      - step: agent
        allow_failure: true
    # Best-effort, like the in-step publish it replaces: a Datadog outage
    # must never fail the build.
    soft_fail: true
    agents:
      queue: hosted
    # Scoped to this step only: it runs only harness scripts from the repo,
    # never the evaluated agent. NOTE: the secret must exist in the cluster
    # before this mapping ships, or the step fails at secret resolution
    # (create it even with an empty value to disable publishing).
    secrets:
      DD_API_KEY: MCP_EVAL_FRAMEWORK_DATADOG_API_KEY
