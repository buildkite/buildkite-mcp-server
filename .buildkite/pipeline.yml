agents:
  queue: hosted

cache:
  name: "build-cache"
  paths:
    - "/gocache"
    - "/gomodcache"
  size: "100g"

steps:
  - group: ":mag: Quality Checks"
    key: quality-checks
    steps:
    - name: ":golangci-lint: lint"
      command: golangci-lint run --output.checkstyle.path checkstyle.xml --verbose --timeout 3m
      artifact_paths:
        - checkstyle.xml
      env:
        GOCACHE: /gocache
        GOMODCACHE: /gomodcache
      plugins:
        - mise#v1.1.5: ~

    - name: ":go: test"
      artifact_paths:
        - cover-tree.svg
        - junit.xml
      commands:
        - go tool gotestsum --junitfile junit.xml --format testname -- -coverprofile=cover.out ./...
        - go tool go-cover-treemap -coverprofile cover.out > cover-tree.svg
        - echo '<details><summary>Coverage tree map</summary><img src="artifact://cover-tree.svg" alt="Test coverage tree map" width="70%"></details>' | buildkite-agent annotate --style "info"
      env:
        GOCACHE: /gocache
        GOMODCACHE: /gomodcache
      plugins:
        - mise#v1.1.5: ~

    - name: ":abacus: tool token report"
      # Ceiling is in estimated tokens (bytes / 3.6); ~1850 estimated is ~2300 Claude tokens.
      command: |
        go build -o tool-token-report ./cmd/tool-token-report
        status=0
        ./tool-token-report --max-tool-tokens 1850 --json tool-tokens.json --markdown - > tool-tokens.md || status=$$?
        style=info; [ "$$status" -ne 0 ] && style=error
        [ -s tool-tokens.md ] && buildkite-agent annotate --style "$$style" --context tool-tokens < tool-tokens.md
        exit "$$status"
      artifact_paths:
        - tool-tokens.json
        - tool-tokens.md
      env:
        GOCACHE: /gocache
        GOMODCACHE: /gomodcache
      plugins:
        - mise#v1.1.5: ~

  - label: ":terminal: build ({{matrix}})"
    command: ".buildkite/release.sh release --clean --snapshot"
    depends_on: quality-checks
    env:
      GOOS: "{{matrix}}"
      GOCACHE: /gocache
      GOMODCACHE: /gomodcache
    matrix:
      - "darwin"
      - "linux"
      - "windows"
    artifact_paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*_checksums.txt
      - dist/*.json
    secrets:
      - MISE_GITHUB_TOKEN
    plugins:
      - mise#v1.1.5: ~

  - label: ":docker: build image"
    depends_on: quality-checks
    command: docker build -t buildkite-mcp-server:latest -f Dockerfile.local .

  - name: ":memo: Trigger docs draft"
    if: build.branch == "main"
    soft_fail: true
    command: .buildkite/steps/trigger-docs-draft.sh
