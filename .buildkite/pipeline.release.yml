image: "buildkite/hosted-agent-base-images:ubuntu-jammy"

agents:
  queue: hosted

steps:
  - label: ":rocket: :github: MCP Release"
    key: release
    command: |
      set -euo pipefail
      .buildkite/release.sh release --clean

      echo "--- Dispatch MCP Registry publish"
      if ! payload=$$(jq -ce 'select(.version | type == "string" and length > 0) |
        {event_type: "mcp-image-released", client_payload: {version}}' dist/metadata.json) ||
        ! curl --fail-with-body --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $$GITHUB_TOKEN" \
          --header 'Content-Type: application/json' \
          --data "$$payload" \
          https://api.github.com/repos/buildkite/buildkite-mcp-server/dispatches; then
        buildkite-agent annotate --style warning --context mcp-registry \
          'Release succeeded, but the MCP Registry workflow could not be queued. See DEVELOPMENT.md to retry.'
      fi
    artifact_paths:
      - dist/**/*
    env:
      AWS_REGION: us-east-1
      EXCHANGE_FUNCTION_ARN: arn:aws:lambda:us-east-1:032379705303:function:exchange
    plugins:
      - aws-assume-role-with-web-identity:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-buildkite-mcp-server-release
          session-tags:
            - organization_id
            - organization_slug
            - pipeline_slug
      - aws-ssm#v1.1.0:
          parameters:
            GHCR_USER: /pipelines/buildkite/buildkite-mcp-server-release/github-user
            GHCR_TOKEN: /pipelines/buildkite/buildkite-mcp-server-release/github-token
            DOCKERHUB_PASSWORD: /pipelines/buildkite/buildkite-mcp-server-release/dockerhub-password
            DOCKERHUB_USER: /pipelines/buildkite/buildkite-mcp-server-release/dockerhub-user
      - mise#v1.1.5: ~

  - label: ":package: Publish to Buildkite Packages"
    key: publish
    depends_on: release
    command: ".buildkite/steps/publish-packages.sh"
    plugins:
      - mise#v1.1.5: ~
