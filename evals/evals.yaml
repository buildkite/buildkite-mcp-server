# Eval matrix — babystand.sh executes each entry, in order.
#
# Per entry:
#   id            Stable key. Namespaces run artifacts (runs/<id>/) and per-entry
#                 Buildkite annotations, and is the key used to match this entry
#                 against the same entry in a previous build for comparison.
#                 Keep it stable across builds; keep it unique within this file.
#   agent         Which LLM agent runs the prompt: 'claude' (Claude Code CLI),
#                 'cursor' (Cursor CLI, cursor-agent) or 'cursor-cloud' (Cursor
#                 CLOUD agents — the hosted harness behind the Cursor app's
#                 Agents window, driven via the Cloud Agents API; see
#                 scripts/cursor-cloud.sh). Other values are skipped with a
#                 loud warning (codex/opencode land in a later stage).
#                 cursor and cursor-cloud entries need CURSOR_API_KEY (see
#                 .buildkite/pipeline.evals.yml) and are skipped loudly when it
#                 is unset; both prepend prompts/system.md to the prompt rather
#                 than sending a system prompt (no equivalent channel).
#                 cursor metrics are partial (no token usage in its
#                 stream-json: tokens/cost null); cursor-cloud reports real
#                 token totals (Cloud Agents /usage) but null cost and null
#                 message counts (its transcript is an SSE delta stream).
#                 cursor-cloud runs in Cursor's cloud VM, so it needs no local
#                 permission posture — but DOES need the Cursor GitHub
#                 integration granted on EVAL_REPO_SLUG (one-time, in the
#                 Cursor dashboard), and its MCP server is BUILT IN THE VM
#                 from the commit under review (see mcp_cursor_cloud.json),
#                 so local uncommitted changes are not what it tests.
#   model         Passed to the agent as --model. Model ids are per-agent
#                 namespaces: claude-* ids for claude; Cursor ids (composer-2.5,
#                 sonnet-4.5, gpt-5.2, ... — see `cursor-agent --list-models`,
#                 or GET https://api.cursor.com/v1/models for cursor-cloud;
#                 ids rotate, aliases like `composer` track latest).
#                 Defaults: claude-opus-4-8 / composer / for cursor-cloud,
#                 unset (the Cursor account's default model applies — pin one
#                 here for stable cross-build comparisons).
#   prompt        Name of a template under prompts/<prompt>.md. Rendered with the
#                 substitution vars below (Go-style {{.KEY}} placeholders).
#   scenario:
#     setup       Optional bash run BEFORE the prompt to establish state (e.g.
#                 create a branch, push it). It runs inside babystand.sh's clone
#                 of the EVAL repo (EVAL_REPO_SLUG), under `set -euo pipefail`
#                 (any failing command fails the setup — and the entry), with
#                 ENTRY_ID, DATETIME, ORG_SLUG, PIPELINE_SLUG exported into its
#                 environment. To pass values on to the prompt, append KEY=VALUE
#                 lines to the file at $SCENARIO_VARS_FILE.
#     vars        Static KEY=VALUE map substituted into the prompt template.
#   kill_agent_on_complete  Optional, cursor-cloud only. Whether to DELETE the
#                 one-shot cloud agent when the run ends (any outcome — success,
#                 failure, or abort). Default: true, because the agent is
#                 durable and keeps its injected env (this entry's Buildkite
#                 API token) until deleted. Set false to keep the agent for
#                 postmortems in the Cursor dashboard — accepting that the
#                 token persists inside it until you delete the agent manually.
#                 (An ambient CURSOR_CLOUD_KEEP_AGENT=1 also keeps it; that's
#                 the local-debugging escape hatch in cursor-cloud.sh.)
#   token_env     Optional. NAME of an env var holding the Buildkite API token
#                 for the org this entry's scenario lives in — scenarios can
#                 point anywhere (e.g. an arbitrary BUILD_URL), and API tokens
#                 are single-org. Convention:
#                 MCP_EVAL_FRAMEWORK_<ORG>_ORG_BUILDKITE_API_TOKEN, matching the
#                 secret names in .buildkite/pipeline.evals.yml (secret-mapped
#                 env names must not start with BUILDKITE/BK). babystand.sh
#                 hands the value to the agent's MCP server as
#                 BUILDKITE_API_TOKEN for this entry's run only; entries whose
#                 named var is unset are skipped loudly. Default: the ambient
#                 BUILDKITE_API_TOKEN.
#   mcp_version   MCP server version this run's agent talks to: a release tag, a
#                 branch, a commit SHA, or 'source' (the in-image binary built
#                 from the code under review). NOTE: overrides other than 'source'
#                 are parsed/validated now but not yet wired into the image build
#                 (that is a follow-up); a non-'source' value currently logs a
#                 notice and runs the 'source' binary.
#   compare_base  Optional. What to compare this run AGAINST. A Buildkite build
#                 (number / URL / 'build:<n>') or a local path: a run prefix
#                 ('local:./runs/<id>/<id>-<datetime>' — that exact run) or a
#                 directory ('local:./runs/<id>' — its first run). Relative
#                 paths resolve against the evals/ dir, not the cwd. Defaults to
#                 the last successful build on `main` for this entry id.
#   compare_target Optional. The run being evaluated. Defaults to THIS run (its
#                 runs/ bundle, plus this Buildkite build's artifacts when a
#                 build was produced). Same source forms as compare_base.
#
# Always-available substitution vars (in addition to scenario vars): ENTRY_ID,
# DATETIME, ORG_SLUG, PIPELINE_SLUG, WAIT_STATUS, DEBUG_STRING.

matrix:
  # The original babystand scenario: drive a red CI branch to green.
  - id: red-to-green-complete
    agent: claude
    model: claude-opus-4-8
    prompt: red-to-green-complete
    scenario:
      setup: |
        # Establish the red CI signal: branch from the deliberately-broken base
        # and push it (the branch push triggers its own Quality Checks build,
        # which is what the agent then fixes). The branch is pushed to the EVAL
        # repo (EVAL_REPO_SLUG — this setup runs inside babystand.sh's clone of
        # it), so its builds run on the EVAL org's pipeline; scenario branches
        # never exist in the repo hosting this eval, so the eval pipeline cannot
        # recurse (see the CROSS-REPO note in .buildkite/pipeline.evals.yml).
        SCENARIO_BRANCH="mcp-eval-scenario-${ENTRY_ID}-${DATETIME}"
        git config user.email "secret-agent@llm.com" && git config user.name "secret-agent"
        git fetch
        git checkout -b "$SCENARIO_BRANCH" origin/test-broken-and-failed-jobs
        git push -u origin HEAD
        # Hand the generated branch name to the prompt template.
        echo "SCENARIO_BRANCH=$SCENARIO_BRANCH" >> "$SCENARIO_VARS_FILE"
    mcp_version: source
    # compare_target defaults to this run.
    compare_base: build:266

  # The same scenario driven by the Cursor CLI instead of Claude Code — lets a
  # build compare how two different agents fare against the same MCP server.
  # Requires CURSOR_API_KEY (uncomment its env + secrets lines in
  # .buildkite/pipeline.evals.yml); skipped loudly while unset. NOTE: metrics
  # are partial for cursor runs (no token usage in its stream-json), so
  # comparisons should lean on tool calls, duration, and the klaren review.
  #- id: red-to-green-complete-cursor
  #  agent: cursor
  #  model: claude-opus-4-8-thinking-high
  #  prompt: red-to-green-complete
  #  scenario:
  #    setup: |
  #      SCENARIO_BRANCH="mcp-eval-scenario-${ENTRY_ID}-${DATETIME}"
  #      git fetch
  #      git checkout -b "$SCENARIO_BRANCH" origin/test-broken-and-failed-jobs
  #      git push -u origin HEAD
  #      echo "SCENARIO_BRANCH=$SCENARIO_BRANCH" >> "$SCENARIO_VARS_FILE"
  #  compare_base: build:94
  #  mcp_version: source

  # The same scenario on a Cursor CLOUD agent — the hosted harness behind the
  # Cursor app's Agents window (what Origin users run), always at Cursor's
  # latest release. The setup still pushes the scenario branch from here; the
  # cloud VM then clones the eval repo at that branch (startingRef) and works
  # there. Requires CURSOR_API_KEY and the Cursor GitHub integration granted
  # on the eval repo; skipped loudly while the key is unset. The MCP server is
  # built inside the VM from the commit under review (mcp_cursor_cloud.json),
  # preserving mcp_version: source. Metrics include real token totals (unlike
  # the cursor CLI) but null cost/message counts.
  #- id: red-to-green-complete-cursor-cloud
  #  agent: cursor-cloud
  #  model: composer-2.5
  #  prompt: red-to-green-complete
  #  scenario:
  #    setup: |
  #      SCENARIO_BRANCH="mcp-eval-scenario-${ENTRY_ID}-${DATETIME}"
  #      git fetch
  #      git checkout -b "$SCENARIO_BRANCH" origin/test-broken-and-failed-jobs
  #      git push -u origin HEAD
  #      echo "SCENARIO_BRANCH=$SCENARIO_BRANCH" >> "$SCENARIO_VARS_FILE"
  #  mcp_version: source
  #  # Explicitly the default: the one-shot cloud agent (and the entry token in
  #  # its env) is deleted when the run ends. Flip to false to keep it for
  #  # postmortems in the Cursor dashboard.
  #  kill_agent_on_complete: true

  # Diagnosis-only variant: point at ANY existing red build — including one on a
  # pipeline we don't own and must not mutate — and produce a written diagnosis.
  # No setup (no branch, no push); BUILD_URL is the only parameter, so it is
  # compared purely via its runs/ bundle.
  # WARN: This is a difficult scenario for MCP to resolve, and it takes a while
  #       to run. Uncomment if you want to test MCP against it.
  #- id: red-to-green-comment-only
  #  agent: claude
  #  model: claude-opus-4-8
  #  prompt: red-to-green-comment-only
  #  scenario:
  #    vars:
  #      BUILD_URL: https://buildkite.com/buildkite/buildkite/builds/204234
  #  # The build above lives in the `buildkite` org, not the default eval org.
  #  token_env: MCP_EVAL_FRAMEWORK_BUILDKITE_ORG_BUILDKITE_API_TOKEN
  #  mcp_version: source

  # A no-build scenario: analyze an existing build and propose speedups. Produces
  # only a written proposal — no git push, no new Buildkite build — so it is
  # compared purely via its runs/ bundle.
  # UNCOMMENT: This is an example of eval using analyze-build prompt. Uncomment to
  #            test
  # - id: analyze-build-speed
  #   agent: claude
  #   model: claude-opus-4-8
