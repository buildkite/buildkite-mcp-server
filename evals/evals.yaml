# Eval matrix — babystand.sh executes each entry, in order.
#
# Per entry:
#   id            Stable key. Namespaces run artifacts (runs/<id>/) and per-entry
#                 Buildkite annotations, and is the key used to match this entry
#                 against the same entry in a previous build for comparison.
#                 Keep it stable across builds; keep it unique within this file.
#   agent         Which LLM agent runs the prompt: 'claude' (Claude Code CLI)
#                 or 'cursor' (Cursor CLI, cursor-agent). Other values are
#                 skipped with a loud warning (codex/opencode land in a later
#                 stage). Cursor entries additionally need CURSOR_API_KEY (see
#                 .buildkite/pipeline.evals.yml) and are skipped loudly when it
#                 is unset; their metrics are partial (cursor-agent's
#                 stream-json emits no token usage, so tokens/cost are null)
#                 and prompts/system.md is prepended to the prompt rather than
#                 appended as a system prompt (no cursor-agent equivalent).
#   model         Passed to the agent as --model. Model ids are per-agent
#                 namespaces: claude-* ids for claude; Cursor ids (composer-1,
#                 sonnet-4.5, gpt-5.2, ... — see `cursor-agent --list-models`)
#                 for cursor. Defaults: claude-opus-4-8 / composer-1.
#   prompt        Name of a template under prompts/<prompt>.md. Rendered with the
#                 substitution vars below (Go-style {{.KEY}} placeholders).
#   scenario:
#     setup       Optional bash run BEFORE the prompt to establish state (e.g.
#                 create a branch, push it). It runs inside babystand.sh's clone
#                 of the EVAL repo (EVAL_REPO_SLUG), under `set -euo pipefail`
#                 (any failing command fails the setup — and the entry), with
#                 ENTRY_ID, DATETIME, ORG_SLUG, PIPELINE_SLUG exported into its
#                 environment. To pass values on to the prompt, append KEY=VALUE
#                 lines to the file at $SCENARIO_VARS_FILE.
#     vars        Static KEY=VALUE map substituted into the prompt template.
#   token_env     Optional. NAME of an env var holding the Buildkite API token
#                 for the org this entry's scenario lives in — scenarios can
#                 point anywhere (e.g. an arbitrary BUILD_URL), and API tokens
#                 are single-org. Convention:
#                 MCP_EVAL_FRAMEWORK_<ORG>_ORG_BUILDKITE_API_TOKEN, matching the
#                 secret names in .buildkite/pipeline.evals.yml (secret-mapped
#                 env names must not start with BUILDKITE/BK). babystand.sh
#                 hands the value to the agent's MCP server as
#                 BUILDKITE_API_TOKEN for this entry's run only; entries whose
#                 named var is unset are skipped loudly. Default: the ambient
#                 BUILDKITE_API_TOKEN.
#   mcp_version   MCP server version this run's agent talks to: a release tag, a
#                 branch, a commit SHA, or 'source' (the in-image binary built
#                 from the code under review). NOTE: overrides other than 'source'
#                 are parsed/validated now but not yet wired into the image build
#                 (that is a follow-up); a non-'source' value currently logs a
#                 notice and runs the 'source' binary.
#   compare_base  Optional. What to compare this run AGAINST. A Buildkite build
#                 (number / URL / 'build:<n>') or a local path: a run prefix
#                 ('local:./runs/<id>/<id>-<datetime>' — that exact run) or a
#                 directory ('local:./runs/<id>' — its first run). Relative
#                 paths resolve against the evals/ dir, not the cwd. Defaults to
#                 the last successful build on `main` for this entry id.
#   compare_target Optional. The run being evaluated. Defaults to THIS run (its
#                 runs/ bundle, plus this Buildkite build's artifacts when a
#                 build was produced). Same source forms as compare_base.
#
# Always-available substitution vars (in addition to scenario vars): ENTRY_ID,
# DATETIME, ORG_SLUG, PIPELINE_SLUG, WAIT_STATUS, DEBUG_STRING.

matrix:
  # The original babystand scenario: drive a red CI branch to green.
  #- id: red-to-green-complete
